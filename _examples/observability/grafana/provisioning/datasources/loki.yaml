apiVersion: 1

# Removes any pre-existing "loki" (e.g. created by hand with another uid)
# before creating the provisioned one; without this Grafana fails with
# "Datasource provisioning error: data source not found".
deleteDatasources:
  - name: loki
    orgId: 1

datasources:
  - name: loki
    uid: loki
    type: loki
    access: proxy
    # Grafana runs in a container: "localhost" would be Grafana itself.
    # Use the docker-compose service name.
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      # "Tempo" button on every log with a trace_id (structured metadata).
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Ver trace
